version: 2

models:
  - name: mart_customers
    description: "Business-ready customer information"

    columns:
      - name: customer_id
        description: "Unique identifier for the customer"
        data_tests:
          - not_null
          - unique

      - name: nation_name
        data_tests:
          - not_null

      - name: region_name
        data_tests:
          - not_null

      - name: customer_value
        data_tests:
          - accepted_values:
              arguments:
                values: ['HIGH', 'MEDIUM', 'LOW'] 